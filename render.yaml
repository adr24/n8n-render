services:
  - type: web
    name: n8n-free
    env: docker
    plan: free
    autoDeploy: true
    buildCommand: ""
    startCommand: "n8n start"
    envVars:
      # ===== Basic Auth =====
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: "admin"
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false   # set manually in Render dashboard Secrets

      # ===== URLs and Networking =====
      # Render assigns PORT automatically; do NOT set N8N_PORT
      - key: WEBHOOK_TUNNEL_URL
        value: "https://n8n-free.onrender.com"  # Replace with your actual Render service URL
      - key: N8N_EDITOR_BASE_URL
        value: "https://n8n-free.onrender.com"
      - key: N8N_HOST
        value: "0.0.0.0"     # Listen on all interfaces
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: GENERIC_TIMEZONE
        value: "America/New_York"

      # ===== Encryption =====
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # ===== Database (PostgreSQL) =====
      - key: DB_TYPE
        value: "postgresdb"
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database

databases:
  - name: n8n-db
    plan: free
